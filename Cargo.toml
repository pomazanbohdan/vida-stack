[workspace]
members = [
    "crates/common-format-jsonl",
    "crates/common-format-toon",
    "crates/docflow-config",
    "crates/docflow-contracts",
    "crates/docflow-core",
    "crates/docflow-cli",
    "crates/docflow-format-jsonl",
    "crates/docflow-format-toon",
    "crates/docflow-inventory",
    "crates/docflow-markdown",
    "crates/docflow-operator",
    "crates/docflow-readiness",
    "crates/docflow-relations",
    "crates/docflow-validation",
    "crates/taskflow-cli",
    "crates/taskflow-config",
    "crates/taskflow-contracts",
    "crates/taskflow-core",
    "crates/taskflow-format-jsonl",
    "crates/taskflow-format-toon",
    "crates/taskflow-authority",
    "crates/taskflow-host-bridge",
    "crates/taskflow-state",
    "crates/taskflow-state-fs",
    "crates/taskflow-state-redb",
    "crates/taskflow-state-surreal",
    "crates/runtime-path-policy",
    "crates/operator-output",
    "crates/vida-contracts",
    "crates/vida-policy-contracts",
    "crates/vida-policy-rhai",
    "crates/vida-test-support",
    "crates/vida-coder",
    "crates/vida-pi-agent",
    "crates/vida-runtime-local",
    "crates/vida-service",
    "crates/vida",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.9.7"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive", "env"] }
config = { version = "0.15.25", default-features = false, features = ["yaml"] }
globset = "0.4.20"
redb = "4.1.0"
effectum = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-jsonlines = "0.7.0"
sha2 = "0.11.0"
service-manager = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio-graceful-shutdown = "0.20.0"
toon-format = "0.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
uuid = { version = "1.24.1", features = ["serde", "v7"] }
walkdir = "2.5.0"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
