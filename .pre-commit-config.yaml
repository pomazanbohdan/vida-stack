minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

exclude: |
  (?x)^(
    \.vida/|
    \.git/|
    target/|
    vendor/|
    tmp/|
    tasks_tmp/|
    .*\.changelog\.jsonl$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^fuzz/seeds/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: vida-script-check
        name: VIDA script/diff hygiene gate
        entry: '"C:\Windows\System32\cmd.exe" /d /s /c scripts\\vida-precommit-script-check.cmd'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: vida-rust-quick
        name: VIDA Rust quick gate (manual)
        entry: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/vida-dev-gate.ps1 -Mode quick
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: vida-semantic-prepush
        name: VIDA semantic P0/P1 pre-push gate
        entry: '"C:\Windows\System32\cmd.exe" /d /s /c scripts\\vida-semantic-prepush.cmd'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: vida-semantic-fuzz
        name: VIDA semantic fuzz profile (manual)
        entry: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/vida-dev-gate.ps1 -Mode semantic-fuzz -Json
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: vida-semantic-loom
        name: VIDA semantic Loom profile (manual)
        entry: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/vida-dev-gate.ps1 -Mode semantic-loom -Json
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: vida-semantic-kani
        name: VIDA semantic Kani profile (manual)
        entry: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/vida-dev-gate.ps1 -Mode semantic-kani -Json
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: vida-semantic-miri
        name: VIDA semantic Miri profile (manual)
        entry: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/vida-dev-gate.ps1 -Mode semantic-miri -Json
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
