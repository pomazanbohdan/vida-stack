name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-assets:
    name: Build assets (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-default
            suffix: ''
          - os: macos-14
            label: macos-arm64
            suffix: 'macos-arm64'
          - os: windows-latest
            label: windows-x86_64
            suffix: 'windows-x86_64'

    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${{ inputs.tag }}"
          fi
          if [[ -z "${release_tag}" ]]; then
            echo "Failed to resolve release tag." >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"

      - name: Check out repository at release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: vida-release-${{ matrix.label }}
          cache-on-failure: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/verify-rust-toolchain/go.mod
          cache: false

      - name: Build and verify Rust toolchain Go binary
        shell: bash
        working-directory: tools/verify-rust-toolchain
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/verify-rust-toolchain"
          go build -trimpath -o "$binary" .
          if [[ -f "${binary}.exe" ]]; then
            binary="${binary}.exe"
          fi
          VIDA_REPO_ROOT="$GITHUB_WORKSPACE" "$binary" --minimum-version 1.97.1 --json > "$RUNNER_TEMP/verify-rust-toolchain.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "verify-rust-toolchain.json").read_text(encoding="utf-8"))
          assert result["status"] == "pass", result
          assert result["required_minimum"] == "1.97.1", result
          assert result["package_count"] > 0, result
          PY

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.suffix }}" ]]; then
            export VIDA_RELEASE_SUFFIX="${{ matrix.suffix }}"
          else
            unset VIDA_RELEASE_SUFFIX
          fi
          bash scripts/build-release.sh "${RELEASE_TAG}"

      - name: Validate exact-version release evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifests = sorted(Path("dist").glob("vida-stack-*.manifest.json"))
          assert manifests, "release manifest was not generated"
          data = json.loads(manifests[0].read_text(encoding="utf-8"))
          assert data["version"] == os.environ["RELEASE_TAG"], data["version"]
          vida = data["binary_versions"]["vida"]
          assert vida["matches_expected_version"] is True, vida
          assert vida["build_timestamp"], vida
          assert data["binary_versions"]["taskflow"]["matches_expected_version"] is True, data["binary_versions"]["taskflow"]
          assert data["binary_versions"]["docflow"]["matches_expected_version"] is True, data["binary_versions"]["docflow"]
          PY

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _release_out
          cp dist/vida-stack-"${RELEASE_TAG}"*.zip _release_out/
          cp dist/vida-stack-"${RELEASE_TAG}"*.tar.gz _release_out/
          cp dist/vida-stack-"${RELEASE_TAG}"*.sha256 _release_out/
          cp dist/vida-stack-"${RELEASE_TAG}"*.manifest.json _release_out/
          if [[ -z "${{ matrix.suffix }}" ]]; then
            cp dist/vida-install.sh _release_out/
            cp dist/vida-install.ps1 _release_out/
          fi

      - name: Upload packaged assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets-${{ matrix.label }}
          path: _release_out/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build-assets
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${{ inputs.tag }}"
          fi
          if [[ -z "${release_tag}" ]]; then
            echo "Failed to resolve release tag." >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"

      - name: Check out repository at release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Download all packaged assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: _release_assets

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: tools/render-public-release-notes/go.mod
          cache: false

      - name: Build release notes renderer
        shell: bash
        working-directory: tools/render-public-release-notes
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/render-public-release-notes" .

      - name: Render public release body
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/render-public-release-notes" "${RELEASE_TAG}" > _release_assets/release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          assets=(
            _release_assets/**/vida-stack-"${RELEASE_TAG}"*.zip
            _release_assets/**/vida-stack-"${RELEASE_TAG}"*.tar.gz
            _release_assets/**/vida-stack-"${RELEASE_TAG}"*.sha256
            _release_assets/**/vida-stack-"${RELEASE_TAG}"*.manifest.json
            _release_assets/**/vida-install.sh
            _release_assets/**/vida-install.ps1
          )

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were found to publish." >&2
            exit 1
          fi

          title="Vida Stack ${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${title}" \
              --notes-file _release_assets/release-notes.md
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "${assets[@]}" \
              --title "${title}" \
              --notes-file _release_assets/release-notes.md
          fi
