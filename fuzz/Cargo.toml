[package]
name = "vida-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
common-format-jsonl = { path = "../crates/common-format-jsonl" }
common-format-toon = { path = "../crates/common-format-toon" }
clap = { version = "4.6.6", features = ["derive"] }
docflow-cli = { path = "../crates/docflow-cli" }
docflow-config = { path = "../crates/docflow-config" }
libfuzzer-sys = "0.4"
serde_json = "1.0"
taskflow-core = { path = "../crates/taskflow-core" }
taskflow-format-jsonl = { path = "../crates/taskflow-format-jsonl" }

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonl_decoder"
path = "fuzz_targets/jsonl_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_parser"
path = "fuzz_targets/cli_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workflow_payload"
path = "fuzz_targets/workflow_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "toon_render"
path = "fuzz_targets/toon_render.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
opt-level = 3
