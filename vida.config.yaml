  defer_fix_until_task_boundary: true
  session_reflection_required: true
  platform_direction: agentic_engineering_platform
  quality_token_efficiency: equal_weight
  session_reflection_criteria:
    - architecture_cleanliness
    - completeness
    - token_efficiency
    - orchestration_efficiency
    - instruction_clarity
    - instruction_runtime_consistency

pack_router_keywords:
  research: ресерч,дослід
  spec: спек,специф
  pool: пул,беклог,декомпоз
  pool_strong: форм-таск
  pool_dependency: залежност
  dev: розроб,продовж
  bug: помил,баг,виправ
  reflect: рефлекс,актуал,онови док
  reflect_strong: субагент,матриц,ініціаліз,фреймворк,самодіагност

agent_system:
  init_on_boot: true
  mode: native
  state_owner: orchestrator_only
  max_parallel_agents: 4
  token_economy:
    enabled: true
    goal: reduce_root_orchestrator_tokens_and_paid_model_calls_during_long_refactor_epics
    weekly_limit_pressure_mode: true
    root_orchestrator_default_posture: synthesize_not_research
    default_readonly_prefetch: true
    prefer_external_free_readonly_carriers:
      - vibe_cli
    prefer_external_advisory_readonly_carriers:
      - vibe_cli
      - jcode_nim_cli
    prefer_internal_low_medium_for_write_carriers:
      - internal_subagents:codex_gpt55_low_write
      - internal_subagents:codex_gpt55_medium_write
    high_cost_carriers_reserved_for:
      - architecture_boundary_decision
      - security_or_safety_review
      - release_readiness_or_mainline_admission
      - repeated_rework_after_low_medium_failure
    root_call_reduction_rules:
      - ask_vibe_for_readonly_pre_analysis_when_scope_is_known_and_no_write_authority_is_needed
      - ask_jcode_nim_for_readonly_pre_analysis_when_vibe_is_unavailable_or_independent_second_opinion_is_useful
      - choose_external_readonly_complete_or_external_patch_proposal_during_research_stage_before_root_implementation
      - ask_internal_low_or_medium_for_bounded_implementation_or_test_authoring
      - keep_root_session_to_binding_synthesis_task_updates_and_final_validation
      - prefer_compact_runtime_surfaces_and_snapshot_reads_before_large_json_bundles
      - batch_related_report_intake_into_one_taskflow_mutation_window
    research_stage_external_delegation_modes:
      external_readonly_complete:
        authority: advisory_readonly
        allowed_task_classes:
          - research
          - analysis
          - specification
          - planning
          - review
          - proof_diagnosis
        required_output:
          - structured_report
          - evidence_refs
          - risks
          - recommended_next_step
        root_responsibility:
          - validate_report_against_source_and_runtime
          - mutate_taskflow_only_after_validation
          - decide_closure_or_followup
      external_patch_proposal:
        authority: patch_proposal_only
        allowed_task_classes:
          - implementation_diagnosis
          - refactor_proposal
          - test_proposal
          - proof_runner_proposal
        required_output:
          - patch_summary
          - proposed_diff_or_file_plan
          - verification_commands
          - rollback_notes
        root_responsibility:
          - apply_or_reject_diff
          - run_tests
          - commit_push_and_close_taskflow
    task_class_carrier_preferences:
      research:
        primary: vibe_cli
        fallback: jcode_nim_cli
        delegation_modes:
          - external_readonly_complete
          - external_patch_proposal
      analysis:
        primary: vibe_cli
        fallback: jcode_nim_cli
        escalation: internal_subagents:codex_gpt55_low_write
      specification:
        primary: vibe_cli
        fallback: jcode_nim_cli
        escalation: internal_subagents:codex_gpt55_medium_write
      planning:
        primary: vibe_cli
        fallback: jcode_nim_cli
        escalation: internal_subagents:codex_gpt55_medium_write
      review:
        primary: vibe_cli
        fallback: jcode_nim_cli
        escalation: internal_subagents:codex_gpt55_medium_write
      coach:
        primary: vibe_cli
        fallback: internal_subagents:codex_gpt55_medium_write
      implementation:
        primary: internal_subagents:codex_gpt55_low_write
        fallback: internal_subagents:codex_gpt55_medium_write
      regression_test:
        primary: internal_subagents:codex_gpt55_medium_write
        fallback: internal_subagents:codex_gpt55_low_write
      verification:
        primary: internal_subagents:codex_gpt55_medium_write
        fallback: vibe_cli
        advisory_alternate: jcode_nim_cli
    escalation_after:
      consecutive_low_medium_failures: 2
      repeated_runtime_blocker_count: 2

  scoring:
    rule: capability_first_then_score_guard_then_cheapest_tier
    consecutive_failure_limit: 3
    promotion_score: 75
    demotion_score: 45
    probation_success_runs: 2
    probation_task_runs: 2
    retirement_failure_limit: 8

  pricing:
    normalized_cost_units_basis: model_profile_relative_units
    default_price_source_kind: provider_catalog
    freshness_defaults:
      required: false
      max_age_days: 30
      stale_price_policy: diagnostic_only_use_normalized_cost_units
      missing_price_policy: diagnostic_only_use_normalized_cost_units
      diagnostic_only: true
      enforced: false
    vendor_basis:
      openai-codex: structured role configs and reasoning-effort tuning in Codex project config; prefer explicit task/runtime settings over implicit chat heuristics
      anthropic: structured prompt templates, explicit sections, and evaluation-backed refinement loops
      microsoft: record one bounded decision/design artifact per change and route on explicit cost-quality tradeoffs instead of ad hoc escalation
      internal: project-maintained normalized reference units for internal executor profiles
      hermes: provider-configured external CLI posture with project-normalized review units
      kilo: provider-configured external CLI posture with project-normalized review units
      vibe: provider-configured external CLI posture with project-normalized review units
      pi: Pi provider/model catalog selected through VIDA profiles and executed through the vida-pi-agent adapter; normalized units are diagnostic until vendor/provider pricing is wired
    providers:
      openai-codex:
        price_basis: vendor_schedule_snapshot
        source_paths:
          - docs/process/codex-agent-configuration-guide.md
        freshness:
          required: false
          max_age_days: 30
          stale_price_policy: diagnostic_only_use_normalized_cost_units
          missing_price_policy: diagnostic_only_use_normalized_cost_units
          diagnostic_only: true
          enforced: false
      anthropic:
        price_basis: vendor_schedule_snapshot
        source_paths:
          - docs/process/codex-agent-configuration-guide.md
        freshness:
          required: false
          max_age_days: 30
          stale_price_policy: diagnostic_only_use_normalized_cost_units
          missing_price_policy: diagnostic_only_use_normalized_cost_units
          diagnostic_only: true
          enforced: false
      microsoft:
        price_basis: decision_record_or_vendor_snapshot
        source_paths:
          - docs/process/codex-agent-configuration-guide.md
        freshness:
          required: false
          max_age_days: 30
          stale_price_policy: diagnostic_only_use_normalized_cost_units
          missing_price_policy: diagnostic_only_use_normalized_cost_units
          diagnostic_only: true
          enforced: false
      internal:
        price_basis: project_normalized_reference_units
        source_paths:
          - docs/process/codex-agent-configuration-guide.md
        freshness:
          required: false
          stale_price_policy: diagnostic_only_use_normalized_cost_units
          missing_price_policy: diagnostic_only_use_normalized_cost_units
          diagnostic_only: true
          enforced: false
      hermes:
        price_basis: provider_configured_external_cli
        source_paths:
          - docs/process/codex-agent-configuration-guide.md
        freshness:
          required: false
          max_age_days: 30
          stale_price_policy: diagnostic_only_use_normalized_cost_units
          missing_price_policy: diagnostic_only_use_normalized_cost_units
          diagnostic_only: true
          enforced: false
      kilo:
        price_basis: provider_configured_external_cli
        source_paths:
          - docs/process/codex-agent-configuration-guide.md
        freshness:
          required: false
          max_age_days: 30
          stale_price_policy: diagnostic_only_use_normalized_cost_units
          missing_price_policy: diagnostic_only_use_normalized_cost_units
          diagnostic_only: true
          enforced: false
      vibe:
        price_basis: provider_configured_external_cli
        source_paths:
          - docs/process/codex-agent-configuration-guide.md
        freshness:
          required: false
          max_age_days: 30
          stale_price_policy: diagnostic_only_use_normalized_cost_units
          missing_price_policy: diagnostic_only_use_normalized_cost_units
          diagnostic_only: true
          enforced: false
      pi:
        price_basis: provider_configured_external_cli
        source_paths:
          - docs/product/spec/pi-primary-environment-agent-carrier-spec.md
        freshness:
          required: false
          max_age_days: 30
          stale_price_policy: diagnostic_only_use_normalized_cost_units
          missing_price_policy: diagnostic_only_use_normalized_cost_units
          diagnostic_only: true
          enforced: false
    model_profile_defaults:
      price_source_kind: provider_catalog
      source_paths:
        - docs/process/codex-agent-configuration-guide.md
      freshness:
        required: false
        max_age_days: 30
        stale_price_policy: diagnostic_only_use_normalized_cost_units
        missing_price_policy: diagnostic_only_use_normalized_cost_units
        diagnostic_only: true
        enforced: false

  model_selection:
    enabled: true
    candidate_scope: unified_carrier_model_profiles
    default_strategy: balanced_cost_quality
    selection_rule: role_task_then_readiness_then_score_then_cost_quality
    free_profiles_allowed: true
    zero_cost_profiles_allowed: true
    quality_floor_by_runtime_role:
      worker: medium
      business_analyst: medium
      pm: medium
      coach: medium
      verifier: high
      prover: high
      solution_architect: high
    reasoning_floor_by_task_class:
      implementation: low
      delivery_task: low
      execution_block: low
      specification: medium
      planning: medium
      test_authoring: medium
      regression_test: medium
      coach: medium
      implementation_medium: medium
      verification: high
      review: high
      quality_gate: medium
      release_readiness: high
      architecture: high
      execution_preparation: high
      hard_escalation: xhigh
      meta_analysis: high
    budget_policy:
      enforce_max_budget_units: true
      allow_escalation_over_budget_with_blocker: true

  stage_attempt_policies:
