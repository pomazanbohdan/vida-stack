project:
  id: vida-stack
  overlay_version: 1

project_bootstrap:
  enabled: true
  docs_root: docs
  process_root: docs/process
  research_root: docs/research
  readme_doc: README.md
  architecture_doc: docs/product/spec/index.md
  decisions_doc: docs/process/decisions.md
  environments_doc: docs/process/environments.md
  project_operations_doc: docs/process/project-operations.md
  agent_system_doc: docs/process/agent-system.md
  allow_scaffold_missing: false
  require_launch_confirmation: false

language_policy:
  user_communication: uk
  reasoning: en
  documentation: en
  todo_protocol: en

host_environment:
  cli_system: codex
  host_agent_bridge_contract:
    schema_version: 1
    selection_mode: configured_host_capability
    receipt_required: true
    no_adapter_policy: fail_closed_emit_request
    process_carrier_requires_explicit_backend: true
    supported_adapter_kinds:
      - codex_host_tools
      - codex_cli_subagents
      - claude_code_subagents
      - pi_sub_agent_plugin
      - vibe_kanban_agents
      - custom_host_agent_adapter
  codex:
    agents: &codex_agent_catalog
      junior:
        tier: junior
        description: Level 1 Codex lane for cheap bounded implementation packets that own one explicit write scope and return concrete delivery evidence without self-approving closure.
        rate: 1
        reasoning_band: low
        model: gpt-5.5
        model_reasoning_effort: low
        sandbox_mode: workspace-write
        default_model_profile: codex_gpt55_low_write
        model_profiles:
          codex_gpt55_low_write:
            provider: openai-codex
            model_ref: gpt-5.5
            reasoning_effort: low
            plan_mode_reasoning_effort: medium
            sandbox_mode: workspace-write
            normalized_cost_units: 1
            pricing:
              price_source_kind: provider_catalog
              source_paths:
                - docs/process/codex-agent-configuration-guide.md
              freshness:
                required: false
                max_age_days: 30
                stale_price_policy: diagnostic_only_use_normalized_cost_units
                missing_price_policy: diagnostic_only_use_normalized_cost_units
                diagnostic_only: true
                enforced: false
            speed_tier: fast
            quality_tier: medium
            write_scope: workspace-write
            runtime_roles:
              - worker
            task_classes:
              - implementation
              - delivery_task
              - execution_block
            readiness:
              mode: codex_profile
              required: true
        default_runtime_role: worker
        runtime_roles:
          - worker
        task_classes:
          - implementation
          - delivery_task
          - execution_block
      middle:
        tier: middle
        description: Level 2 Codex lane for bounded specification, planning, spec-conformance coach review, and medium implementation packets when the work still fits one packet and does not require senior proof or architecture escalation.
        rate: 4
        reasoning_band: medium
        model: gpt-5.5
        model_reasoning_effort: medium
        sandbox_mode: workspace-write
        default_model_profile: codex_gpt55_medium_write
        model_profiles:
          codex_gpt55_medium_write:
            provider: openai-codex
            model_ref: gpt-5.5
            reasoning_effort: medium
            plan_mode_reasoning_effort: high
            sandbox_mode: workspace-write
            normalized_cost_units: 4
            speed_tier: fast
            quality_tier: medium
            write_scope: workspace-write
            runtime_roles:
              - business_analyst
              - pm
              - coach
              - worker
            task_classes:
              - specification
              - planning
              - coach
              - implementation_medium
              - test_authoring
              - regression_test
              - quality_gate
            readiness:
              mode: codex_profile
              required: true
        default_runtime_role: coach
        runtime_roles:
          - business_analyst
          - pm
          - coach
          - worker
        task_classes:
          - specification
          - planning
          - coach
          - implementation_medium
          - test_authoring
          - regression_test
          - quality_gate
      senior:
        tier: senior
        description: Level 3 Codex lane for independent verification, proof-strength review, and high-confidence closure gates that fail closed on missing evidence.
        rate: 16
        reasoning_band: high
        model: gpt-5.5
        model_reasoning_effort: high
        sandbox_mode: read-only
        default_model_profile: codex_gpt55_high_readonly
        model_profiles:
          codex_gpt55_high_readonly:
            provider: openai-codex
            model_ref: gpt-5.5
            reasoning_effort: high
            plan_mode_reasoning_effort: high
            sandbox_mode: read-only
            normalized_cost_units: 16
            speed_tier: medium
            quality_tier: high
            write_scope: read-only
            runtime_roles:
              - verifier
              - prover
            task_classes:
              - verification
              - review
              - quality_gate
              - release_readiness
            readiness:
              mode: codex_profile
              required: true
        default_runtime_role: verifier
        runtime_roles:
          - verifier
          - prover
        task_classes:
          - verification
          - review
          - quality_gate
          - release_readiness
      architect:
        tier: architect
        description: Level 4 Codex lane for architecture preparation, hard escalation, and cross-scope conflict resolution when the normal implementer-coach-verifier path cannot close lawfully.
        rate: 48
        reasoning_band: xhigh
        model: gpt-5.5
        model_reasoning_effort: xhigh
        sandbox_mode: read-only
        default_model_profile: codex_gpt55_xhigh_arch
        model_profiles:
          codex_gpt55_high_arch:
            provider: openai-codex
            model_ref: gpt-5.5
            reasoning_effort: high
            plan_mode_reasoning_effort: high
            sandbox_mode: read-only
            normalized_cost_units: 32
            speed_tier: medium
            quality_tier: high
            write_scope: read-only
            runtime_roles:
              - solution_architect
            task_classes:
              - architecture
              - execution_preparation
              - hard_escalation
              - meta_analysis
            readiness:
              mode: codex_profile
              required: true
          codex_gpt55_xhigh_arch:
            provider: openai-codex
            model_ref: gpt-5.5
            reasoning_effort: xhigh
            plan_mode_reasoning_effort: xhigh
            sandbox_mode: read-only
            normalized_cost_units: 48
            speed_tier: slow
            quality_tier: very_high
            write_scope: read-only
            runtime_roles:
              - solution_architect
            task_classes:
              - hard_escalation
              - architecture
              - meta_analysis
            readiness:
              mode: codex_profile
              required: true
        default_runtime_role: solution_architect
        runtime_roles:
          - solution_architect
        task_classes:
          - architecture
          - execution_preparation
          - hard_escalation
          - meta_analysis
  systems:
    codex:
      enabled: true
      execution_class: internal
      execution_boundary: parent_host_session
      dispatch_transport: host_tool_bridge
      receipt_mode: host_bridge_receipt
      materialization_mode: codex_toml_catalog_render
      template_root: .codex
      runtime_root: .codex
      app:
        enabled: true
        config_path: .codex/config.toml
        template_path: .codex/templates/codex-app.config.toml
        agents_dir: .codex/agents
        multi_agent: true
        internal_alias_projection: true
        platform_overrides:
          windows:
            shell_environment_policy:
              inherit: all
              exclude:
                - "*_KEY"
                - "*_SECRET"
                - "*_TOKEN"
                - "AWS_*"
                - "AZURE_*"
            agent_bootstrap_instructions: |
              VIDA command resolution for Windows Codex App:
              1. Before invoking `vida`, first try `Get-Command vida -ErrorAction SilentlyContinue`.
              2. If `vida` is not on PATH, resolve the installed production binary from `$env:LOCALAPPDATA\vida-stack\current\bin\vida.exe`.
              3. If `LOCALAPPDATA` is missing but `USERPROFILE` is present, resolve `$env:USERPROFILE\AppData\Local\vida-stack\current\bin\vida.exe`.
              4. When the installed production binary exists, prepend its parent directory to `$env:PATH` for the current process and invoke that binary or the refreshed `vida` command.
              5. Treat `target\debug\vida.exe` and `target\release\vida.exe` as repository diagnostics only; do not use them as the production VIDA runtime unless the parent packet explicitly asks for diagnostic fallback.
      legacy_cli:
        enabled: true
        template_path: .codex/templates/codex-cli.config.toml
        multi_agent_feature_required: true
      host_tool_bridge:
        adapter_kind: codex_host_tools
        adapter_capability_id: codex.multi_agent_v1
        invocation_mode: parent_host_tool_api
        dispatch_transport: host_tool_bridge
        receipt_mode: host_bridge_receipt
        tool_family: codex_multi_agent
        spawn_tool: multi_agent_v1.spawn_agent
        wait_tool: multi_agent_v1.wait_agent
        close_tool: multi_agent_v1.close_agent
        adapter_required: true
        no_adapter_policy: fail_closed_emit_request
        process_carrier_requires_explicit_backend: true
        fallback_process_carrier: codex_cli_exec
        request_dir: .vida/data/state/host-tool-bridge/requests
        result_dir: .vida/data/state/host-tool-bridge/results
        receipt_dir: .vida/data/state/host-tool-bridge/receipts
      carriers: *codex_agent_catalog
    hermes:
      enabled: false
      execution_class: external
      materialization_mode: copy_tree_only
      template_root: .hermes
      runtime_root: .hermes
      carriers:
        hermes-primary:
          tier: hermes
          description: Placeholder carrier for the Hermes CLI.
          rate: 4
          reasoning_band: medium
          default_runtime_role: worker
          runtime_roles:
            - worker
          task_classes:
            - specification
            - planning
    pi:
      enabled: false
      execution_class: external
      materialization_mode: pi_agent_projection_render
      template_root: .pi
      runtime_root: .pi
      authority: config_projection_only
      source_of_truth: vida.config.yaml
      app:
        enabled: false
        settings_path: .pi/settings.json
        agents_dir: .pi/agents
        chains_dir: .pi/chains
        internal_agent_projection: true
        projection_owner: vida
        local_files_are_authority: false
      dispatch:
        command: vida-pi-agent
        adapter_command: vida-pi-agent
        provider_command: pi
        static_args:
          - --mode
          - rpc
        model_flag: --model
        thinking_level_flag: --thinking-level
        workdir_flag: --workdir
        output_mode: vida_result_json
        prompt_mode: stdin
        one_process_per_dispatch: true
        session_policy: no_long_lived_session
      carriers:
        pi-primary:
          tier: pi
          description: Pi host-environment carrier projection; execution receipts are produced through the separate `pi_cli` external carrier and `vida-pi-agent` adapter.
          rate: 4
          reasoning_band: medium
          default_runtime_role: worker
          runtime_roles:
            - worker
            - business_analyst
            - coach
            - verifier
          task_classes:
            - implementation
            - delivery_task
            - execution_block
            - specification
            - planning
            - analysis
            - review
            - coach
            - verification
          authority: config_projection_only

protocol_activation:
  agent_system: true

party_chat:
  enabled: true
  replaces_problem_party: true
  execution_mode: multi_agent
  model_routing_strategy: by_role
  default_board_size: small
  min_experts: 2
  max_experts: 16
  hard_cap_agents: 20
  dei_enabled: true
  single_agent:
    backend: internal_subagents
    model: codex_gpt55_low_write
  role_model_bindings:
    party_chat_facilitator:
      backend: internal_subagents
      model: codex_gpt55_high_readonly
    party_chat_architect:
      backend: internal_subagents
      model: codex_gpt55_xhigh_arch
    party_chat_runtime_systems:
      backend: internal_subagents
      model: codex_gpt55_xhigh_arch
    party_chat_quality_verification:
      backend: internal_subagents
      model: codex_gpt55_high_readonly
    party_chat_delivery_cost:
      backend: internal_subagents
      model: codex_gpt55_high_readonly
    party_chat_product_scope:
      backend: internal_subagents
      model: codex_gpt55_low_write
    party_chat_system_analyst:
      backend: internal_subagents
      model: codex_gpt55_medium_write
    party_chat_product_designer:
      backend: internal_subagents
      model: codex_gpt55_low_write
    party_chat_security_safety:
      backend: internal_subagents
      model: codex_gpt55_high_readonly
    party_chat_sre_observability:
      backend: internal_subagents
