          runtime_role: business_analyst
          task_class: analysis
          isolation: external_readonly_complete
        - attempt_id: analysis-jcode-readonly
          carrier_id: jcode_nim_cli
          model_profile_id: jcode_nim_mistral_medium35_review
          conversation_role: analyst
          runtime_role: business_analyst
          task_class: analysis
          isolation: external_readonly_complete
      consolidator:
        attempt_id: analysis-root-consolidator
        carrier_id: internal_subagents
        model_profile_id: codex_gpt55_medium_write
        conversation_role: analyst
        runtime_role: business_analyst
        task_class: analysis
        isolation: root_validate_only
    specification:
      fanout:
        mode: parallel
        max_attempts: 2
      attempts:
