    require_flow_resolution: true
    fail_closed_on_validation_error: true

dev_team:
  enabled: true
  contract_doc: docs/process/team-development-and-orchestration-protocol.md
  preserve_existing_agent_extensions: true
  preserve_existing_flow_sets: true
  default_flow_id: task_delivery_verified
  orchestrator_command_contract:
    canonical_surface: vida agent dispatch-next
    default_args:
      - --dev-team
      - --current-task-id
      - "{{task_id}}"
    human_default_output: compact_toon
    machine_output_arg: --json
    receipt_backed_packet_required: true
    first_packet_must_match_configured_first_step: true
    stale_downstream_packet_policy: fail_closed_do_not_resume
    host_bridge_policy: materialize_packet_before_execute_dispatch
    root_orchestrator_role: orchestrator
    role_sequence_for_runtime_defect:
      - analyst
      - autotester
      - developer
      - coach_validator
      - tester
      - prover
  work_item_flow_bindings:
    epic: default_delivery
    defect: defect_repair_verified
    runtime_defect: runtime_defect_remediation
    pull_request: pr_processing_team
    pr_repair: pr_processing_team
    architecture: architecture_design
    release_readiness: release_readiness_gate
    service_tui: service_tui_orchestration
    internal_agent_development: hook_enabled_internal_agent_development
    task: task_delivery_verified
    debug: debug_fast
  validation:
    require_role_contracts: true
    require_flow_definitions: true
    require_runtime_role_binding: true
    require_task_class_binding: true
    require_default_carrier_binding: true
    require_handoff_contracts: true
    require_ordered_closure_flow: true
    fail_closed_on_validation_error: true
  roles:
    analyst:
      runtime_role: business_analyst
      task_classes:
        - specification
        - planning
      packet_template_kind: delivery_task_packet
      closure_class: law
      stage: design_gate
      completion_blocker: pending_specification_evidence
      inclusion_rule: always
      default_carrier: middle
      cost_policy:
        budget_units: 4
        selection_rule: cheapest_eligible_specification_carrier
      handoff:
        next_role: test_author
        required_outputs:
          - detailed_task_brief
          - architectural_context
          - bounded_problem_statement
          - acceptance_contract
          - owned_write_scope
          - stop_rules
          - duplication_risk_map
        fail_closed_on_missing_handoff: true
    architect:
      runtime_role: solution_architect
      task_classes:
        - architecture
        - execution_preparation
      packet_template_kind: escalation_packet
      closure_class: refactor
      stage: execution
      completion_blocker: pending_execution_preparation_evidence
      inclusion_rule: always
      default_carrier: architect
      cost_policy:
        budget_units: 16
        selection_rule: xhigh_architecture_carrier_for_execution_preparation
      handoff:
        next_role: developer
        required_outputs:
          - implementation_plan
          - owned_write_scope
          - architecture_decisions
          - explicit_blockers
        fail_closed_on_missing_handoff: true
    test_author:
      runtime_role: worker
      task_classes:
        - test_authoring
        - regression_test
      packet_template_kind: delivery_task_packet
      closure_class: implementation
      stage: execution
      completion_blocker: pending_implementation_evidence
      inclusion_rule: always
      default_carrier: middle
      cost_policy:
        budget_units: 4
        selection_rule: cheapest_eligible_test_authoring_carrier_with_middle_quality_floor
      handoff:
        next_role: coach_test_gate
        required_outputs:
          - failing_regression_test
          - fixture_rationale
          - expected_behavior_reference
          - proof_command
          - implementation_handoff_notes
          - explicit_blockers
        fail_closed_on_missing_handoff: true
    autotester:
      runtime_role: worker
      task_classes:
        - test_authoring
        - regression_test
        - verification_test_design
      packet_template_kind: delivery_task_packet
      closure_class: implementation
      stage: execution
      completion_blocker: pending_implementation_evidence
      inclusion_rule: always
      default_carrier: middle
      cost_policy:
        budget_units: 4
        selection_rule: cheapest_eligible_autotest_authoring_carrier_with_middle_quality_floor
      handoff:
        next_role: developer
        required_outputs:
          - failing_regression_test
          - integration_test_matrix
          - fixture_rationale
          - proof_command
          - expected_behavior_reference
          - explicit_blockers
        fail_closed_on_missing_handoff: true
    coach_test_gate:
      runtime_role: coach
      task_classes:
        - coach
      packet_template_kind: coach_review_packet
      closure_class: proof
      stage: execution
      completion_blocker: pending_review_clean_evidence
      inclusion_rule: always
      default_carrier: middle
      cost_policy:
        budget_units: 4
        selection_rule: configured_coach_carrier_for_test_quality_gate
      handoff:
        next_role: developer
        required_outputs:
          - test_quality_review
          - expected_failure_evidence
          - weak_fixture_or_acceptance_gap_decision
          - approve_or_rework_decision
          - explicit_blockers
        fail_closed_on_missing_handoff: true
    developer:
      runtime_role: worker
      task_classes:
        - implementation
        - delivery_task
        - execution_block
      packet_template_kind: delivery_task_packet
      closure_class: implementation
      stage: execution
      completion_blocker: pending_implementation_evidence
      inclusion_rule: always
      default_carrier: junior
      cost_policy:
        budget_units: 1
        fallback_carrier: middle
        selection_rule: cheapest_eligible_write_carrier
      handoff:
        next_role: coach_implementation_gate
        required_outputs:
          - changed_files
          - verification_notes
          - residual_risks
          - explicit_blockers
        fail_closed_on_missing_handoff: true
    coach_implementation_gate:
      runtime_role: coach
      task_classes:
        - coach
        - review
      packet_template_kind: coach_review_packet
      closure_class: proof
      stage: execution
      completion_blocker: pending_review_clean_evidence
      inclusion_rule: always
      default_carrier: middle
      cost_policy:
        budget_units: 4
        selection_rule: configured_coach_carrier_for_implementation_conformance_gate
      handoff:
        next_role: duplication_reviewer
        required_outputs:
          - implementation_conformance_review
          - accepted_test_alignment
          - spec_conformance_review
          - rework_or_approve_decision
          - unresolved_risks
        fail_closed_on_missing_handoff: true
    coach_validator:
      runtime_role: coach
      task_classes:
        - coach
        - review
        - validation
      packet_template_kind: coach_review_packet
      closure_class: proof
      stage: execution
      completion_blocker: pending_review_clean_evidence
      inclusion_rule: always
      default_carrier: middle
      cost_policy:
        budget_units: 4
        selection_rule: configured_coach_carrier_for_root_cause_validation
      handoff:
        next_role: tester
        required_outputs:
          - root_cause_validation
          - false_green_risk_review
          - receipt_backed_execution_review
          - rework_or_approve_decision
          - explicit_blockers
        fail_closed_on_missing_handoff: true
    duplication_reviewer:
      runtime_role: verifier
      task_classes:
        - review
        - verification
        - quality_gate
      packet_template_kind: coach_review_packet
      closure_class: proof
      stage: execution
      completion_blocker: pending_review_clean_evidence
      inclusion_rule: always
      default_carrier: senior
      cost_policy:
        budget_units: 16
        selection_rule: independent_duplication_and_architecture_reuse_review
      review_contract:
        purpose: Confirm the implementation is architectural and integrated, reuses existing framework/runtime contracts, and does not duplicate code, config semantics, taskflow projections, or operator surfaces.
        required_checks:
          - shared_contract_reuse
          - duplicated_logic_scan
          - duplicated_config_schema_scan
          - existing_helper_reuse
          - architecture_boundary_integrity
          - no_dead_code_or_unwired_helpers
        fail_closed_on_duplication: true
      handoff:
        next_role: tester
        required_outputs:
