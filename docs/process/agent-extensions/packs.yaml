version: 1
packs:
  - pack_id: quick-two-pack
    flow_id: quick-two-pack-flow
    enabled: true
    default: true
    description: Fast two-role implementation cleanup pack.
    work_item_bindings: [epic, defect, runtime_defect, pull_request, pr_repair, architecture, release_readiness, service_tui, internal_agent_development, task, debug, feature, requirements_change, review, quality_gate, small_patch]
    ordered_steps:
      - role_id: coder
        task_class: implementation
        dispatch_alias: development_implementer
        command_ref: agent-init-worker
      - role_id: cleaner
        task_class: implementation
        dispatch_alias: development_cleaner
        command_ref: agent-init-worker
        proof_target: agent:quick-two-pack:cleaner

