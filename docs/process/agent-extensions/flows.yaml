    role_chain: business_analyst,worker
    lifecycle_hook_templates: command_timing_summary
    adapter_projection:
      host_agent_bridge_contract: required
      process_carrier_requires_explicit_backend: true
    execution_preparation_policy:
      mode: required_for_code_shaped_work
      task_classes: implementation,execution_preparation,architecture,hard_escalation
      honor_validation_gate: true
      architecture_signals: architecture,architect,cross-cutting,cross cutting,migration,refactor,topology,boundary,cross-scope,cross scope
      write_signals: implement,implementation,write code,write the code,patch,refactor,build
