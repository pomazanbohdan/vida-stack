  - flow_id: runtime_defect_remediation
    schema_version: 1
    flow_class: development
    description: Runtime-defect remediation flow for VIDA/TaskFlow blockers, with surface matrix analysis, regression proof, implementation, recovery validation, and closure proof.
    work_item_bindings: runtime_defect
    role_chain: business_analyst,worker,worker,verifier,prover
    lifecycle_hook_templates: command_timing_summary
    adapter_projection:
      host_agent_bridge_contract: required
      process_carrier_requires_explicit_backend: true
      pack_alias_layer: true
    sequential: true
    allow_parallel_handoffs: false
    proof_gates:
      terminal_proof_target: agent:runtime-defect-pack:prover
      structured_evidence_required: true
      evidence_surface: vida task proof attach-evidence
    steps:
      - role_id: specifier
        runtime_role: business_analyst
        task_class: specification
        receive_mode: task
        worktree_policy: current
        owns: [runtime_defect_spec, reproduction_contract, owned_write_scope]
        does_not_own: [implementation, closure]
        allowed_mutations: [task_notes, diagnostic_docs]
        required_outputs: [bounded_problem_statement, acceptance_contract, owned_write_scope]
        handoff_target: test_author
        forbidden_actions: [write_code_without_dispatch]
      - role_id: test_author
        runtime_role: worker
        task_class: test_authoring
        receive_mode: task
        worktree_policy: isolated_per_task
        owns: [regression_test, fixture_rationale]
        does_not_own: [production_fix, release_approval]
        allowed_mutations: [tests, fixtures]
        required_outputs: [failing_regression_test, fixture_rationale, proof_command]
        handoff_target: coder
        forbidden_actions: [change_production_code]
      - role_id: coder
        runtime_role: worker
        task_class: implementation
        receive_mode: task
        worktree_policy: isolated_per_task
        owns: [runtime_fix, changed_files, proof_command]
        does_not_own: [validation_approval, closure]
        allowed_mutations: [source_code, tests]
        required_outputs: [changed_files, verification_notes, residual_risks]
        handoff_target: reviewer_validator
        forbidden_actions: [approve_own_work]
      - role_id: reviewer_validator
        runtime_role: coach
        task_class: validation
        receive_mode: task
        worktree_policy: current
        owns: [root_cause_validation, false_green_risk_review]
        does_not_own: [source_mutation, release_approval]
        allowed_mutations: [review_artifacts]
        required_outputs: [root_cause_validation, rework_or_approve_decision, explicit_blockers]
        handoff_target: hardender
        forbidden_actions: [mutate_source]
      - role_id: hardender
        runtime_role: verifier
        task_class: quality_gate
        receive_mode: batch
        worktree_policy: isolated_per_lane
        quality_profile: runtime_hardening_optional
        batch_policy:
          group_by: [priority, order_bucket, parallel_group]
          require_owned_paths: true
          require_conflict_domain_clear: true
        owns: [edge_case_review, mutation_lite, runtime_invariant_hardening]
        does_not_own: [approval, qa_user_flow_proof]
        allowed_mutations: [source_code, tests]
        required_outputs: [hardening_summary, tests_added_or_skipped, conflict_domain_evidence]
        handoff_target: qa_tester
        forbidden_actions: [approve_release, batch_without_owned_paths]
      - role_id: qa_tester
        runtime_role: verifier
        task_class: verification
        receive_mode: task
        worktree_policy: current
        quality_profile: runtime_cli_smoke
        owns: [operator_cli_verification, regression_reproduction]
        does_not_own: [structured_proof_closure]
        allowed_mutations: [test_artifacts]
        required_outputs: [verification_evidence, failing_or_passing_checks, residual_risks]
        handoff_target: prover
        forbidden_actions: [close_without_prover]
      - role_id: prover
        runtime_role: prover
        task_class: release_readiness
        receive_mode: task
        worktree_policy: current
        proof_target: agent:runtime-defect-pack:prover
        owns: [structured_proof_evidence, closure_readiness]
        does_not_own: [new_implementation]
        allowed_mutations: [proof_artifacts, task_proof_evidence]
        required_outputs: [closure_readiness_decision, proof_summary, release_risks]
        forbidden_actions: [legacy_close_reason_as_proof_authority]
