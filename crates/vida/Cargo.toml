[package]
name = "vida"
version = "0.9.7"
edition = "2021"
build = "build.rs"

[features]
default = []
coder = []

[[bin]]
name = "vida"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.5.38", features = ["derive", "env"] }
docflow-cli = { path = "../docflow-cli" }
docflow-contracts = { path = "../docflow-contracts" }
fs2 = "0.4.3"
futures = "0.3.31"
interprocess = { version = "2.4.2", features = ["tokio"] }
libc = "0.2"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
surrealdb = { version = "3.0.2", features = ["kv-surrealkv"] }
taskflow-contracts = { path = "../taskflow-contracts" }
taskflow-cli = { path = "../taskflow-cli" }
taskflow-core = { path = "../taskflow-core" }
taskflow-format-toon = { path = "../taskflow-format-toon" }
taskflow-state = { path = "../taskflow-state" }
taskflow-state-fs = { path = "../taskflow-state-fs" }
taskflow-state-surreal = { path = "../taskflow-state-surreal" }
tarpc = { version = "0.37.0", features = ["serde1", "serde-transport-json", "tokio1"] }
time = { workspace = true }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
vida-contracts = { path = "../vida-contracts" }

[dev-dependencies]
vida-test-support = { path = "../vida-test-support" }

[build-dependencies]
time = { workspace = true }
