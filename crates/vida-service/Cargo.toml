[package]
name = "vida-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vida-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
interprocess = { version = "2.4.3", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
service-manager.workspace = true
tarpc = { version = "0.38.0", features = ["serde1", "serde-transport-json", "tokio1"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-graceful-shutdown.workspace = true
vida-contracts = { path = "../vida-contracts" }
vida-runtime-local = { path = "../vida-runtime-local" }

[dev-dependencies]
tempfile = "3.23.0"
